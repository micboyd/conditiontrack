<div class="p-6">
	<h2 class="text-base font-semibold text-zinc-900 mb-6">
		{{ selectedSession ? 'Edit Session' : 'New Session' }}
	</h2>

	<form [formGroup]="sessionForm" (ngSubmit)="onSubmit()" class="space-y-5">

		<div>
			<label class="block text-xs font-medium text-zinc-500 mb-1.5">
				Session Name <span class="text-red-400">*</span>
			</label>
			<input type="text" formControlName="name" placeholder="e.g. Full Body HIIT"
				class="w-full px-3 py-2 border rounded-lg text-base sm:text-sm text-zinc-800 placeholder-zinc-300 focus:outline-none focus:ring-2 focus:border-transparent transition-colors"
				[ngClass]="isInvalid('name') ? 'border-red-400 focus:ring-red-300' : 'border-zinc-200 focus:ring-zinc-900'" />
			@if (isInvalid('name')) {
				<p class="flex items-center gap-1 text-xs text-red-500 mt-1.5">
					<i class="fa-sharp fa-solid fa-circle-exclamation text-[10px]"></i>
					Session name is required
				</p>
			}
		</div>

		<div>
			<label class="block text-xs font-medium text-zinc-500 mb-1.5">
				Duration (minutes) <span class="text-red-400">*</span>
			</label>
			<input type="number" formControlName="duration" placeholder="e.g. 45"
				class="w-full px-3 py-2 border rounded-lg text-base sm:text-sm text-zinc-800 placeholder-zinc-300 focus:outline-none focus:ring-2 focus:border-transparent transition-colors"
				[ngClass]="isInvalid('duration') ? 'border-red-400 focus:ring-red-300' : 'border-zinc-200 focus:ring-zinc-900'" />
			@if (isInvalid('duration')) {
				<p class="flex items-center gap-1 text-xs text-red-500 mt-1.5">
					<i class="fa-sharp fa-solid fa-circle-exclamation text-[10px]"></i>
					Duration is required
				</p>
			}
		</div>

		<div>
			<label class="block text-xs font-medium text-zinc-500 mb-1.5">
				Category <span class="text-red-400">*</span>
			</label>
			<app-button-toggle
				[options]="['HIIT', 'Cardio', 'Endurance', 'Mobility']"
				[singleSelect]="true"
				[selected]="selectedCategories"
				(selectionChange)="updateCategory($event)"
				colorClass="blue">
			</app-button-toggle>
			@if (isInvalid('category')) {
				<p class="flex items-center gap-1 text-xs text-red-500 mt-1.5">
					<i class="fa-sharp fa-solid fa-circle-exclamation text-[10px]"></i>
					Please select a category
				</p>
			}
		</div>

		<div>
			<label class="block text-xs font-medium text-zinc-500 mb-1.5">Description</label>
			<textarea formControlName="description" placeholder="e.g. High intensity intervals with short rest periods" rows="3"
				class="w-full px-3 py-2 border border-zinc-200 rounded-lg text-base sm:text-sm text-zinc-800 placeholder-zinc-300 focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:border-transparent resize-none"></textarea>
		</div>

		<div class="flex gap-3 pt-2">
			<button type="submit"
				class="flex-1 bg-zinc-900 hover:bg-zinc-800 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors cursor-pointer">
				@if (formLoading) {
					<app-loading-indicator [spinner]="true" [loading]="true"></app-loading-indicator>
				} @else {
					Save Session
				}
			</button>
			<button type="button" (click)="closeEditMode()"
				class="px-4 py-2 text-sm font-medium text-zinc-600 bg-zinc-100 hover:bg-zinc-200 rounded-lg transition-colors cursor-pointer">
				Cancel
			</button>
		</div>

	</form>
</div>
