<div class="p-6">
	<h2 class="text-base font-semibold text-gray-900 mb-6">
		{{ selectedSession ? 'Edit Session' : 'New Session' }}
	</h2>

	<form [formGroup]="sessionForm" (ngSubmit)="onSubmit()" class="space-y-5">

		<div>
			<label class="block text-xs font-medium text-gray-500 mb-1.5">Session Name</label>
			<input type="text" formControlName="name" placeholder="e.g. Full Body HIIT"
				class="w-full px-3 py-2 border rounded-lg text-sm text-gray-800 placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
				[ngClass]="isInvalid('name') ? 'border-red-400' : 'border-gray-200'" />
			@if (isInvalid('name')) {
				<p class="text-xs text-red-500 mt-1">Name is required</p>
			}
		</div>

		<div>
			<label class="block text-xs font-medium text-gray-500 mb-1.5">Duration (minutes)</label>
			<input type="number" formControlName="duration" placeholder="e.g. 45"
				class="w-full px-3 py-2 border rounded-lg text-sm text-gray-800 placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
				[ngClass]="isInvalid('duration') ? 'border-red-400' : 'border-gray-200'" />
			@if (isInvalid('duration')) {
				<p class="text-xs text-red-500 mt-1">Duration is required</p>
			}
		</div>

		<div>
			<label class="block text-xs font-medium text-gray-500 mb-1.5">Category</label>
			<app-button-toggle
				[options]="['HIIT', 'Cardio', 'Endurance', 'Mobility']"
				[singleSelect]="true"
				[selected]="selectedCategories"
				(selectionChange)="updateCategory($event)"
				colorClass="blue">
			</app-button-toggle>
			@if (isInvalid('category')) {
				<p class="text-xs text-red-500 mt-1">Category is required</p>
			}
		</div>

		<div>
			<label class="block text-xs font-medium text-gray-500 mb-1.5">Description</label>
			<textarea formControlName="description" placeholder="e.g. High intensity intervals with short rest periods" rows="3"
				class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-800 placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"></textarea>
		</div>

		<div class="flex gap-3 pt-2">
			<button type="submit" [disabled]="sessionForm.invalid"
				class="flex-1 bg-blue-600 hover:bg-blue-700 disabled:opacity-40 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors cursor-pointer">
				@if (formLoading) {
					<app-loading-indicator [spinner]="true" [loading]="true"></app-loading-indicator>
				} @else {
					Save Session
				}
			</button>
			<button type="button" (click)="closeEditMode()"
				class="px-4 py-2 text-sm font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors cursor-pointer">
				Cancel
			</button>
		</div>

	</form>
</div>
