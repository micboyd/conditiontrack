<aside class="fixed top-0 left-0 h-screen w-64 bg-white border-r border-gray-100 flex flex-col z-20">

	<!-- Logo -->
	<div class="flex items-center gap-3 px-5 py-5 border-b border-gray-100">
		<div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
			<i class="fa-sharp fa-solid fa-bolt text-white text-sm"></i>
		</div>
		<span class="font-semibold text-gray-900 text-base tracking-tight">ConditionTrack</span>
	</div>

	<!-- Nav -->
	<nav class="flex-1 overflow-y-auto px-3 py-4 flex flex-col gap-6">

		<div>
			<p class="text-[10px] font-semibold uppercase tracking-widest text-gray-400 px-3 mb-2">Main Menu</p>
			<ul class="flex flex-col gap-1">
				<li>
					<a routerLink="/dashboard" routerLinkActive="bg-blue-50 text-blue-600 font-medium"
						class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-500 hover:bg-gray-50 hover:text-gray-800 transition-colors text-sm">
						<i class="fa-sharp fa-solid fa-grid-2 w-4 text-center"></i>
						<span>Dashboard</span>
					</a>
				</li>
				<li>
					<a routerLink="/strength/workout-records" routerLinkActive="bg-blue-50 text-blue-600 font-medium"
						class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-500 hover:bg-gray-50 hover:text-gray-800 transition-colors text-sm">
						<i class="fa-sharp fa-solid fa-dumbbell w-4 text-center"></i>
						<span>Strength</span>
					</a>
				</li>
				<li>
					<a routerLink="/conditioning/conditioning-records" routerLinkActive="bg-blue-50 text-blue-600 font-medium"
						class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-500 hover:bg-gray-50 hover:text-gray-800 transition-colors text-sm">
						<i class="fa-sharp fa-solid fa-person-running w-4 text-center"></i>
						<span>Cardio</span>
					</a>
				</li>
				<li>
					<a routerLink="/nutrition/meal-library" routerLinkActive="bg-blue-50 text-blue-600 font-medium"
						class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-500 hover:bg-gray-50 hover:text-gray-800 transition-colors text-sm">
						<i class="fa-sharp fa-solid fa-utensils w-4 text-center"></i>
						<span>Nutrition</span>
					</a>
				</li>
				<li>
					<a routerLink="/week-planner" routerLinkActive="bg-blue-50 text-blue-600 font-medium"
						class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-500 hover:bg-gray-50 hover:text-gray-800 transition-colors text-sm">
						<i class="fa-sharp fa-solid fa-calendar-days w-4 text-center"></i>
						<span>Week Planner</span>
					</a>
				</li>
			</ul>
		</div>

		<div>
			<p class="text-[10px] font-semibold uppercase tracking-widest text-gray-400 px-3 mb-2">Account</p>
			<ul class="flex flex-col gap-1">
				<li>
					<a routerLink="/profile" routerLinkActive="bg-blue-50 text-blue-600 font-medium"
						class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-500 hover:bg-gray-50 hover:text-gray-800 transition-colors text-sm">
						<i class="fa-sharp fa-solid fa-user w-4 text-center"></i>
						<span>Profile</span>
					</a>
				</li>
				<li>
					<a routerLink="/global-settings" routerLinkActive="bg-blue-50 text-blue-600 font-medium"
						class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-500 hover:bg-gray-50 hover:text-gray-800 transition-colors text-sm">
						<i class="fa-sharp fa-solid fa-gear w-4 text-center"></i>
						<span>Settings</span>
					</a>
				</li>
			</ul>
		</div>

	</nav>

	<!-- User -->
	<div class="px-4 py-4 border-t border-gray-100 flex items-center gap-3">
		<div class="w-9 h-9 rounded-full overflow-hidden flex-shrink-0 bg-blue-100 flex items-center justify-center">
			<img *ngIf="user?.profileImage" [src]="user!.profileImage" alt="Profile" class="w-full h-full object-cover" />
			<span *ngIf="!user?.profileImage" class="text-blue-600 text-xs font-semibold">{{ initials }}</span>
		</div>
		<div class="min-w-0 flex-1">
			<p class="text-sm font-medium text-gray-900 truncate">{{ user?.firstname }} {{ user?.lastname }}</p>
			<p class="text-xs text-gray-400 truncate">{{ user?.username }}</p>
		</div>
		<a routerLink="/login" class="text-gray-400 hover:text-gray-600 transition-colors" title="Sign out">
			<i class="fa-sharp fa-solid fa-arrow-right-from-bracket text-sm"></i>
		</a>
	</div>

</aside>
