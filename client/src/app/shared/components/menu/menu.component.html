<nav class="fixed top-0 left-0 right-0 h-14 bg-zinc-900 z-30 flex items-center px-6 gap-6">

	<!-- Logo -->
	<a routerLink="/dashboard" class="flex items-center gap-2.5 flex-shrink-0 mr-2">
		<div class="w-6 h-6 bg-white rounded flex items-center justify-center flex-shrink-0">
			<i class="fa-sharp fa-solid fa-bolt text-zinc-900 text-[11px]"></i>
		</div>
		<span class="font-semibold text-white text-sm tracking-tight">ConditionTrack</span>
	</a>

	<!-- Nav links -->
	<div class="flex items-center gap-0.5 flex-1">
		<a routerLink="/dashboard" routerLinkActive="text-white bg-white/10"
			class="px-3 py-1.5 rounded-md text-zinc-400 hover:text-white hover:bg-white/5 text-sm transition">
			Dashboard
		</a>
		<a routerLink="/strength/workout-records" routerLinkActive="text-white bg-white/10"
			class="px-3 py-1.5 rounded-md text-zinc-400 hover:text-white hover:bg-white/5 text-sm transition">
			Strength
		</a>
		<a routerLink="/conditioning/conditioning-records" routerLinkActive="text-white bg-white/10"
			class="px-3 py-1.5 rounded-md text-zinc-400 hover:text-white hover:bg-white/5 text-sm transition">
			Cardio
		</a>
		<a routerLink="/nutrition/meal-library" routerLinkActive="text-white bg-white/10"
			class="px-3 py-1.5 rounded-md text-zinc-400 hover:text-white hover:bg-white/5 text-sm transition">
			Nutrition
		</a>
		<a routerLink="/week-planner" routerLinkActive="text-white bg-white/10"
			class="px-3 py-1.5 rounded-md text-zinc-400 hover:text-white hover:bg-white/5 text-sm transition">
			Week Planner
		</a>
		<a routerLink="/progress/photos" routerLinkActive="text-white bg-white/10"
			class="px-3 py-1.5 rounded-md text-zinc-400 hover:text-white hover:bg-white/5 text-sm transition">
			Progress
		</a>
	</div>

	<!-- User -->
	<div class="flex items-center gap-3 flex-shrink-0">
		<div class="flex items-center gap-2">
			<div class="w-7 h-7 rounded-full bg-zinc-700 flex items-center justify-center overflow-hidden flex-shrink-0">
				<img *ngIf="user?.profileImage" [src]="user!.profileImage" alt="Profile" class="w-full h-full object-cover" />
				<span *ngIf="!user?.profileImage" class="text-white text-xs">{{ initials }}</span>
			</div>
			<span class="text-sm text-zinc-300 hidden sm:block">{{ user?.firstname }}</span>
		</div>
		<a routerLink="/login" class="text-zinc-500 hover:text-white transition" title="Sign out">
			<i class="fa-sharp fa-solid fa-arrow-right-from-bracket text-sm"></i>
		</a>
	</div>

</nav>
