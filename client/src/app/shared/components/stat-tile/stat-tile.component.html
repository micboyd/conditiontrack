<div class="rounded-xl px-4 py-3 {{ boxClass }}">
	<div class="flex items-center gap-1.5 mb-2">
		@if (icon) {
			<i class="fa-sharp fa-solid {{ icon }} text-[10px] {{ accentClass }}"></i>
		}
		<span class="text-[10px] font-medium uppercase tracking-wider {{ accentClass }}">{{ label }}</span>
	</div>
	<p class="text-2xl font-bold text-zinc-900 leading-none">{{ value }}@if (suffix) {<span class="text-sm font-normal text-zinc-400 ml-1">{{ suffix }}</span>}@if (unit) {<span class="text-sm font-normal text-zinc-400 ml-1">{{ unit }}</span>}</p>
</div>
