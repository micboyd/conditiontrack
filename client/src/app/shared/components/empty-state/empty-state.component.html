@switch (variant) {
	@case ('inline') {
		<p class="text-sm text-zinc-300 py-5 text-center">{{ message }}</p>
	}
	@case ('rich') {
		<div class="bg-white rounded-2xl px-6 py-16 text-center">
			<div class="{{ badgeClass }} flex items-center justify-center mx-auto mb-4">
				<i class="fa-sharp fa-solid {{ icon }} {{ iconClass }}"></i>
			</div>
			<p class="{{ titleClass }} mb-1">{{ title }}</p>
			@if (description) {
				<p class="{{ descriptionClass }}">{{ description }}</p>
			}
			<div class="mt-5 empty:hidden">
				<ng-content></ng-content>
			</div>
		</div>
	}
	@default {
		<div class="bg-white rounded-2xl px-6 py-16 text-center">
			@if (icon) {
				<i class="fa-sharp fa-solid {{ icon }} text-2xl text-zinc-300 mb-3"></i>
			}
			<p class="text-sm text-zinc-400">{{ message }}</p>
		</div>
	}
}
