<div class="relative">

    <!-- Trigger button -->
    <button
        #triggerBtn
        type="button"
        (click)="toggle()"
        [disabled]="disabled"
        class="w-full flex items-center justify-between gap-2 px-3 py-2.5 bg-zinc-50 border border-zinc-200 rounded-lg text-sm text-left transition-all cursor-pointer focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent disabled:opacity-50 disabled:cursor-not-allowed"
        [class.border-violet-400]="isOpen"
        [class.ring-2]="isOpen"
        [class.ring-violet-500]="isOpen"
        [class.bg-white]="isOpen">
        <span class="truncate" [class.text-zinc-900]="selectedLabel" [class.text-zinc-400]="!selectedLabel">
            {{ selectedLabel || placeholder }}
        </span>
        <i class="fa-sharp fa-solid fa-chevron-down text-zinc-400 text-xs flex-shrink-0 transition-transform duration-200"
           [class.rotate-180]="isOpen"></i>
    </button>

    <!-- Dropdown panel — rendered with fixed position to escape overflow:hidden parents -->
    @if (isOpen) {
        <div
            class="app-select-panel bg-white border border-zinc-200 rounded-xl shadow-xl py-1.5 max-h-60 overflow-y-auto"
            [ngStyle]="panelStyle">

            @if (options.length === 0) {
                <p class="px-3 py-2 text-sm text-zinc-400 italic">No options available</p>
            }

            @for (option of options; track option.value) {
                <button
                    type="button"
                    (click)="select(option, $event)"
                    class="w-full flex items-center justify-between gap-2 px-3 py-2 text-sm transition-colors cursor-pointer text-left"
                    [class.bg-violet-50]="option.value === value"
                    [class.text-violet-700]="option.value === value"
                    [class.font-semibold]="option.value === value"
                    [class.text-zinc-700]="option.value !== value"
                    [class.hover:bg-zinc-50]="option.value !== value">
                    <span class="truncate">{{ option.label }}</span>
                    @if (option.value === value) {
                        <i class="fa-sharp fa-solid fa-check text-violet-500 text-xs flex-shrink-0"></i>
                    }
                </button>
            }

        </div>
    }

</div>
