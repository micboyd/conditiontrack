<div class="flex items-center gap-1 text-zinc-400 {{ wrapperClass }}">
	@if (showView) {
	<button (click)="view.emit()" class="min-h-[44px] min-w-[44px] flex items-center justify-center hover:text-zinc-700 transition cursor-pointer">
		<i class="fa-sharp fa-solid fa-eye {{ iconClass }}"></i>
	</button>
	}
	<button (click)="edit.emit()" class="min-h-[44px] min-w-[44px] flex items-center justify-center hover:text-zinc-700 transition cursor-pointer">
		<i class="fa-sharp fa-solid fa-pen-to-square {{ iconClass }}"></i>
	</button>
	<button (click)="remove.emit()" class="min-h-[44px] min-w-[44px] flex items-center justify-center hover:text-red-500 transition cursor-pointer">
		<i class="fa-sharp fa-solid fa-trash {{ iconClass }}"></i>
	</button>
</div>
