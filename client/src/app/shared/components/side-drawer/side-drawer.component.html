@if(showButton) {
<button
	(click)="toggle()"
	class="flex items-center gap-2 cursor-pointer"
	aria-haspopup="dialog"
	[attr.aria-expanded]="isOpen"
	aria-controls="app-side-menu">
	<span>Menu</span>
</button>
}

<!-- Overlay -->
<div *ngIf="isOpen" (click)="close()" class="fixed inset-0 bg-black/50 z-10 backdrop-blur-sm" aria-hidden="true"></div>

<!-- Drawer -->
<nav
	id="app-side-menu"
	role="dialog"
	aria-modal="true"
	[attr.aria-label]="'Main menu'"
	[class.transition-transform]="isReady"
	class="fixed top-0 h-screen bg-white transform duration-300 ease-in-out z-20
         {{ widths.base }} {{ widths.md }} {{ widths.lg }}
         flex flex-col"
	[class.right-0]="side === 'right'"
	[class.left-0]="side === 'left'"
	[ngClass]="{
		'translate-x-0': isOpen,
		'translate-x-full': !isOpen && side === 'right',
		'-translate-x-full': !isOpen && side === 'left',
		'invisible': !isOpen && !isReady,
		'shadow-2xl': isOpen
	}">
	<!-- Close -->
	<div class="flex justify-end px-6 pt-6 pb-2 shrink-0 border-b border-zinc-100">
		<button (click)="close()" class="w-8 h-8 rounded-full bg-zinc-100 hover:bg-zinc-200 flex items-center justify-center transition cursor-pointer" aria-label="Close menu">
			<i class="fa-sharp fa-solid fa-xmark text-zinc-600 text-sm"></i>
		</button>
	</div>

	<!-- Content -->
	<div class="flex-1 overflow-y-auto">
		<ng-content></ng-content>
	</div>
</nav>
