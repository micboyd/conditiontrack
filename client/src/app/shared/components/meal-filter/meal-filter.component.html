<div class="space-y-3">

	<!-- Search -->
	<div class="relative">
		<i class="fa-sharp fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-zinc-400 text-sm pointer-events-none"></i>
		<input type="text"
			[value]="searchQuery"
			(input)="onSearchInput($any($event.target).value)"
			placeholder="Search meals…"
			class="w-full pl-10 pr-4 py-3 bg-white border border-zinc-200 rounded-xl text-sm text-zinc-900 placeholder-zinc-400 focus:outline-none focus:border-zinc-400 transition" />
	</div>

	<!-- Category chips + calorie range inline -->
	<div class="flex flex-wrap items-center gap-2">

		<!-- Category chips -->
		<button (click)="setCategory('')"
			class="px-3 py-2 rounded-full text-xs font-medium transition cursor-pointer whitespace-nowrap"
			[class]="selectedCategory === '' ? 'bg-zinc-900 text-white' : 'bg-white border border-zinc-200 text-zinc-600 hover:border-zinc-400'">
			All
		</button>
		@for (cat of categories; track cat) {
			<button (click)="setCategory(cat)"
				class="px-3 py-2 rounded-full text-xs font-medium transition cursor-pointer whitespace-nowrap"
				[class]="selectedCategory === cat ? 'bg-zinc-900 text-white' : 'bg-white border border-zinc-200 text-zinc-600 hover:border-zinc-400'">
				{{ cat }}
			</button>
		}

		<!-- Divider -->
		<span class="w-px h-5 bg-zinc-200 mx-1 flex-shrink-0"></span>

		<!-- Calorie range -->
		<input type="number" min="0" placeholder="Min"
			[value]="calorieMinInput ?? ''"
			(input)="calorieMinInput = $any($event.target).value ? +$any($event.target).value : null"
			(keyup.enter)="applyCalorieRange()"
			class="w-20 px-2.5 py-2 bg-white border border-zinc-200 rounded-xl text-xs text-zinc-900 placeholder-zinc-400 focus:outline-none focus:border-zinc-400 transition" />
		<span class="text-zinc-400 text-xs flex-shrink-0">–</span>
		<input type="number" min="0" placeholder="Max"
			[value]="calorieMaxInput ?? ''"
			(input)="calorieMaxInput = $any($event.target).value ? +$any($event.target).value : null"
			(keyup.enter)="applyCalorieRange()"
			class="w-20 px-2.5 py-2 bg-white border border-zinc-200 rounded-xl text-xs text-zinc-900 placeholder-zinc-400 focus:outline-none focus:border-zinc-400 transition" />
		<button (click)="applyCalorieRange()"
			class="px-3 py-2 bg-zinc-900 text-white text-xs font-medium rounded-xl hover:bg-zinc-800 transition cursor-pointer whitespace-nowrap">
			Apply
		</button>
		@if (calorieRangeActive) {
			<button (click)="clearCalorieRange()"
				class="px-3 py-2 bg-white border border-zinc-200 text-zinc-500 text-xs font-medium rounded-xl hover:border-zinc-400 transition cursor-pointer">
				Clear
			</button>
		}

	</div>

</div>
