<!-- Page header -->
<div class="bg-white border-b border-zinc-100">
	<app-container [noPadding]="true"><div class="pt-6 sm:pt-8">
		<h1 class="text-2xl sm:text-3xl font-bold text-zinc-900 mb-1">Body Composition</h1>
		<p class="text-sm text-zinc-400 mb-6">Track your measurements and physical transformation over time</p>

		<!-- Tab nav -->
		<div class="flex gap-0 overflow-x-auto pb-px">
			<a routerLink="measurements"
				routerLinkActive="border-b-2 border-zinc-900 text-zinc-900 font-semibold"
				[routerLinkActiveOptions]="{ exact: true }"
				class="px-4 py-3 text-sm text-zinc-400 hover:text-zinc-700 transition -mb-px font-medium whitespace-nowrap">
				Measurements
			</a>
			<a routerLink="timeline"
				routerLinkActive="border-b-2 border-zinc-900 text-zinc-900 font-semibold"
				[routerLinkActiveOptions]="{ exact: true }"
				class="px-4 py-3 text-sm text-zinc-400 hover:text-zinc-700 transition -mb-px font-medium whitespace-nowrap">
				Timeline
			</a>
		</div>
	</div></app-container>
</div>

<!-- Content -->
<div class="bg-zinc-50 min-h-screen">
	<app-container [noPadding]="true"><div class="py-5 sm:py-8">
		<router-outlet></router-outlet>
	</div></app-container>
</div>
