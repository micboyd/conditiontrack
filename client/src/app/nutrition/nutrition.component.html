<!-- Light page header with tabs -->

		<h1 class="text-2xl sm:text-3xl font-bold text-zinc-900 mb-1">Nutrition</h1>
		<p class="text-sm text-zinc-400 mb-6">Track your meals and monitor macros</p>
		<div class="flex gap-0 overflow-x-auto pb-px">
			<a routerLink="/nutrition/meal-library"
				routerLinkActive="border-b-2 border-zinc-900 text-zinc-900 font-semibold"

			</a>

	</div></app-container>
