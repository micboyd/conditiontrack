<div class="bg-white rounded-2xl overflow-hidden shadow-sm">
	<div class="px-5 py-4 flex items-center justify-between border-b border-zinc-50">
		<div class="flex items-center gap-2.5">
			<div class="w-7 h-7 rounded-lg {{ chipBg }} flex items-center justify-center flex-shrink-0">
				<i class="fa-sharp fa-solid {{ icon }} {{ chipText }} text-[11px]"></i>
			</div>
			<span class="text-sm font-semibold text-zinc-900">{{ title }}</span>
		</div>
		<button (click)="action.emit()"
			class="flex items-center gap-1 text-xs font-medium text-zinc-500 hover:text-zinc-900 bg-zinc-100 hover:bg-zinc-200 px-3 py-2 rounded-full transition cursor-pointer min-h-[44px]">
			<i class="fa-sharp fa-solid fa-plus text-[9px]"></i>
			{{ actionLabel }}
		</button>
	</div>
	@if (isEmpty) {
		<app-empty-state variant="inline" [message]="emptyMessage"></app-empty-state>
	} @else {
		<ul class="divide-y divide-zinc-50 px-5">
			<ng-content></ng-content>
		</ul>
	}
</div>
