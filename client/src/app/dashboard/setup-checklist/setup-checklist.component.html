<div class="bg-zinc-900 rounded-2xl px-5 py-5">
	<div class="flex items-start justify-between gap-4 mb-4">
		<div>
			<p class="text-xs font-semibold text-zinc-500 uppercase tracking-widest mb-1">Getting Started</p>
			<h3 class="text-base font-semibold text-white">Build your health picture</h3>
			<p class="text-sm text-zinc-400 mt-0.5">{{ doneCount }} of {{ total }} steps complete</p>
		</div>
		<a routerLink="/setup-checklist"
			class="flex-shrink-0 flex items-center gap-1.5 text-xs font-medium text-zinc-300 hover:text-white transition cursor-pointer mt-1">
			View checklist
			<i class="fa-sharp fa-solid fa-arrow-right text-[10px]"></i>
		</a>
	</div>

	<!-- Progress bar -->
	<div class="h-1.5 bg-white/10 rounded-full overflow-hidden mb-3">
		<div class="h-full bg-white rounded-full transition-all duration-500"
			[style.width.%]="total > 0 ? (doneCount / total) * 100 : 0"></div>
	</div>

	<!-- Remaining items preview -->
	<div class="flex flex-wrap gap-2">
		@for (item of incomplete; track item.title) {
		<a [routerLink]="item.route"
			class="flex items-center gap-1.5 text-xs text-zinc-400 hover:text-zinc-200 bg-white/5 hover:bg-white/10 border border-white/10 rounded-full px-3 py-1.5 transition cursor-pointer">
			<i class="fa-sharp fa-solid fa-circle text-[5px]"></i>
			{{ item.title }}
		</a>
		}
		@if (remaining > 3) {
		<span class="text-xs text-zinc-600 px-3 py-1.5">+{{ remaining - 3 }} more</span>
		}
	</div>
</div>
