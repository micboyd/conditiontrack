<div class="p-6">
	<h2 class="text-base font-semibold text-zinc-900 mb-6">
		{{ selectedExercise ? 'Edit Exercise' : 'New Exercise' }}
	</h2>

	<form [formGroup]="exerciseForm" (ngSubmit)="onSubmit()" class="space-y-5">

		<div>
			<label class="block text-xs font-medium text-zinc-500 mb-1.5">
				Exercise Name <span class="text-red-400">*</span>
			</label>
			<input type="text" formControlName="name" placeholder="e.g. Push-Ups"
				class="w-full px-3 py-2 border rounded-lg text-base sm:text-sm text-zinc-800 placeholder-zinc-300 focus:outline-none focus:ring-2 focus:border-transparent transition-colors"
				[ngClass]="isInvalid('name') ? 'border-red-400 focus:ring-red-300' : 'border-zinc-200 focus:ring-zinc-900'" />
			@if (isInvalid('name')) {
				<p class="flex items-center gap-1 text-xs text-red-500 mt-1.5">
					<i class="fa-sharp fa-solid fa-circle-exclamation text-[10px]"></i>
					Exercise name is required
				</p>
			}
		</div>

		<div>
			<label class="block text-xs font-medium text-zinc-500 mb-1.5">
				Description <span class="text-red-400">*</span>
			</label>
			<textarea formControlName="description" placeholder="e.g. Upper body pushing movement" rows="4"
				class="w-full px-3 py-2 border rounded-lg text-base sm:text-sm text-zinc-800 placeholder-zinc-300 focus:outline-none focus:ring-2 focus:border-transparent resize-none transition-colors"
				[ngClass]="isInvalid('description') ? 'border-red-400 focus:ring-red-300' : 'border-zinc-200 focus:ring-zinc-900'"></textarea>
			@if (isInvalid('description')) {
				<p class="flex items-center gap-1 text-xs text-red-500 mt-1.5">
					<i class="fa-sharp fa-solid fa-circle-exclamation text-[10px]"></i>
					Description is required
				</p>
			}
		</div>

		<div class="flex gap-3 pt-2">
			<button type="submit"
				[disabled]="exerciseForm.invalid"
				class="flex-1 bg-zinc-900 hover:bg-zinc-800 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-medium px-4 py-3.5 rounded-lg transition-colors cursor-pointer">
				@if (formLoading) {
					<app-loading-indicator [spinner]="true" [loading]="true"></app-loading-indicator>
				} @else {
					Save Exercise
				}
			</button>
			<button type="button" (click)="closeEditMode()"
				class="px-4 py-3.5 text-sm font-medium text-zinc-600 bg-zinc-100 hover:bg-zinc-200 rounded-lg transition-colors cursor-pointer">
				Cancel
			</button>
		</div>

	</form>
</div>
