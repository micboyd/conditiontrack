<app-side-drawer (closeEvent)="onDrawerClosed()">
	<app-edit-exercise
		[selectedExercise]="selectedExercise"
		(closeEditModeEvent)="closeDrawer()">
	</app-edit-exercise>
</app-side-drawer>

<div class="flex items-center justify-between mb-7">
	<h2 class="text-xl font-semibold text-zinc-900">Exercise Library</h2>
	<button (click)="openDrawer()"
		class="flex items-center gap-2 bg-zinc-900 hover:bg-zinc-800 text-white text-sm font-medium px-5 py-2.5 rounded-full transition cursor-pointer">
		<i class="fa-sharp fa-solid fa-plus text-xs"></i>
		Add Exercise
	</button>
</div>

@if (exercisesLoading) {
	<div class="py-8">
		<app-loading-indicator [loading]="true"></app-loading-indicator>
	</div>
} @else if (allExercises.length === 0) {
	<div class="bg-white rounded-2xl px-6 py-16 text-center text-sm text-zinc-400">
		No exercises yet. Add your first exercise to get started.
	</div>
} @else {
	<div class="bg-white rounded-2xl overflow-hidden shadow-sm">
		<table class="w-full text-sm">
			<thead>
				<tr class="bg-zinc-50 border-b border-zinc-100">
					<th class="px-6 py-3.5 text-left text-[11px] font-medium text-zinc-400 uppercase tracking-wider">Name</th>
					<th class="px-6 py-3.5 text-left text-[11px] font-medium text-zinc-400 uppercase tracking-wider">Description</th>
					<th class="px-6 py-3.5 text-right text-[11px] font-medium text-zinc-400 uppercase tracking-wider"></th>
				</tr>
			</thead>
			<tbody class="divide-y divide-zinc-50">
				@for (exercise of allExercises; track exercise._id) {
				<tr class="hover:bg-zinc-50 transition-colors">
					<td class="px-6 py-4 text-zinc-900 font-semibold whitespace-nowrap">{{ exercise.name }}</td>
					<td class="px-6 py-4 text-zinc-400 max-w-sm truncate">{{ exercise.description || '—' }}</td>
					<td class="px-6 py-4 text-right">
						<div class="flex items-center justify-end gap-3 text-zinc-300">
							<button (click)="openDrawer(exercise)" class="hover:text-zinc-700 transition cursor-pointer">
								<i class="fa-sharp fa-solid fa-pen-to-square text-sm"></i>
							</button>
							<button (click)="deleteExercise(exercise._id)" class="hover:text-red-500 transition cursor-pointer">
								<i class="fa-sharp fa-solid fa-trash text-sm"></i>
							</button>
						</div>
					</td>
				</tr>
				}
			</tbody>
		</table>
	</div>
}
