<app-side-drawer (closeEvent)="closeDrawer()">
	<app-edit-exercise
		[selectedExercise]="selectedExercise"
		(closeEditModeEvent)="closeDrawer()">
	</app-edit-exercise>
</app-side-drawer>

<div class="bg-white rounded-xl border border-gray-100">
	<div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
		<h2 class="text-sm font-semibold text-gray-900">Exercise Library</h2>
		<button (click)="openDrawer()"
			class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-3 py-1.5 rounded-lg transition-colors cursor-pointer">
			<i class="fa-sharp fa-solid fa-plus text-xs"></i>
			Add Exercise
		</button>
	</div>

	@if (exercisesLoading) {
		<div class="px-6 py-8">
			<app-loading-indicator [loading]="true"></app-loading-indicator>
		</div>
	} @else if (allExercises.length === 0) {
		<div class="px-6 py-10 text-center text-sm text-gray-400">
			No exercises yet. Add your first exercise to get started.
		</div>
	} @else {
		<table class="w-full text-sm">
			<thead>
				<tr class="text-xs text-gray-400 uppercase tracking-wider">
					<th class="px-6 py-3 text-left font-medium">Name</th>
					<th class="px-6 py-3 text-left font-medium">Description</th>
					<th class="px-6 py-3 text-right font-medium"></th>
				</tr>
			</thead>
			<tbody>
				@for (exercise of allExercises; track exercise._id) {
				<tr class="border-t border-gray-50 hover:bg-gray-50 transition-colors">
					<td class="px-6 py-3.5 text-gray-800 font-medium whitespace-nowrap">{{ exercise.name }}</td>
					<td class="px-6 py-3.5 text-gray-400 max-w-sm truncate">{{ exercise.description || '—' }}</td>
					<td class="px-6 py-3.5 text-right">
						<div class="flex items-center justify-end gap-3 text-gray-400">
							<button (click)="openDrawer(exercise)" class="hover:text-gray-700 transition-colors cursor-pointer">
								<i class="fa-sharp fa-solid fa-pen-to-square text-sm"></i>
							</button>
							<button (click)="deleteExercise(exercise._id)" class="hover:text-red-500 transition-colors cursor-pointer">
								<i class="fa-sharp fa-solid fa-trash text-sm"></i>
							</button>
						</div>
					</td>
				</tr>
				}
			</tbody>
		</table>
	}
</div>
